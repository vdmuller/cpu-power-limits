name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh && bash -n cpu-power-limits-sleep
      - run: shellcheck install.sh cpu-power-limits-sleep
      - name: Validate systemd unit against staged executable
        run: |
          mkdir -p /tmp/cpu-power-limits-stage
          ./install.sh --root /tmp/cpu-power-limits-stage
          sed 's@/usr/local/libexec/cpu-power-limits@/tmp/cpu-power-limits-stage/usr/local/libexec/cpu-power-limits@' cpu-power-limits.service > /tmp/cpu-power-limits.service
          systemd-analyze verify /tmp/cpu-power-limits.service
