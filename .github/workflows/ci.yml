name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck gettext python3-gi gir1.2-gtk-3.0 gir1.2-dbusmenu-glib-0.4 xvfb dbus-x11 desktop-file-utils
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh && bash -n uninstall.sh && bash -n cpu-power-limits-sleep
      - run: shellcheck install.sh uninstall.sh cpu-power-limits-sleep tools/update-translations.sh
      - name: Native GTK navigation and demo checks
        run: CPU_POWER_LIMITS_GUI_TESTS=1 xvfb-run -a dbus-run-session -- /usr/bin/python3 -m unittest discover -s tests -p test_gui_smoke.py -v
      - name: Private D-Bus protocol checks
        run: CPU_POWER_LIMITS_BUS_TESTS=1 dbus-run-session -- /usr/bin/python3 -m unittest discover -s tests -p test_helper_bus.py -v
      - name: Validate systemd unit against staged executable
        run: |
          mkdir -p /tmp/cpu-power-limits-stage
          ./install.sh --root /tmp/cpu-power-limits-stage
          sed 's@/usr/local/libexec/cpu-power-limits@/tmp/cpu-power-limits-stage/usr/local/libexec/cpu-power-limits@' cpu-power-limits.service > /tmp/cpu-power-limits.service
          systemd-analyze verify /tmp/cpu-power-limits.service
          sed 's@/usr/local/libexec/cpu-power-limits-helper@/tmp/cpu-power-limits-stage/usr/local/libexec/cpu-power-limits-helper@' cpu-power-limits-helper.service > /tmp/cpu-power-limits-helper.service
          systemd-analyze verify /tmp/cpu-power-limits-helper.service
          desktop-file-validate /tmp/cpu-power-limits-stage/usr/local/share/applications/io.github.vdmuller.CpuPowerLimits.Indicator.desktop /tmp/cpu-power-limits-stage/etc/xdg/autostart/cpu-power-limits.desktop
