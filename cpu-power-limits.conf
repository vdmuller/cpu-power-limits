# Package power limits in positive integer watts. PL1 must not exceed PL2.
AC_PL1=100
AC_PL2=135
BATTERY_PL1=35
BATTERY_PL2=45

# Optional global undervolt offsets in mV; both signs mean negative offsets.
# Missing/commented keys preserve current hardware offsets; explicit 0 resets one.
# These are examples from one machine, not recommended universal settings.
# CORE_OFFSET=150
# CACHE_OFFSET=150
# IGPU_OFFSET=80
# UNCORE_OFFSET=0
